# Smoke tests run against an in-memory H2 database, so `./mvnw test` needs no
# Postgres running. The schema is generated from the @Entity classes exactly as
# it is in production — which is itself part of what the tests check.
spring.datasource.url=jdbc:h2:mem:parking;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
